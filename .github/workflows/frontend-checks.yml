name: Frontend checks

on:
  push:
    branches:
      - ui-redesign
  pull_request:
    branches:
      - ui-redesign

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
      - name: Check code style
        run: npm run lint
