
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="SkillSwap Campus - Share your skills, connect with fellow students, and learn together."
    />

    <meta name="theme-color" content="#075BDB" />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="SkillSwap Campus"
    />

    <!-- App Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icons/icon-512.png"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      href="/icons/icon-192.png"
    />

    <!-- InfinityFree challenges direct manifest requests. Build the manifest
         in a Blob so browsers can read it without requesting a static file. -->
    <script>
      (() => {
        const baseUrl = window.location.origin;
        const manifestData = {
          id: baseUrl + "/",
          name: "SkillSwap Campus",
          short_name: "SkillSwap",
          description: "Share skills, meet students, and learn together.",
          start_url: baseUrl + "/",
          scope: baseUrl + "/",
          display: "standalone",
          orientation: "any",
          background_color: "#071A8C",
          theme_color: "#075BDB",
          icons: [
            {
              src: baseUrl + "/icons/icon-192.png",
              sizes: "192x192",
              type: "image/png",
              purpose: "any"
            },
            {
              src: baseUrl + "/icons/icon-512.png",
              sizes: "512x512",
              type: "image/png",
              purpose: "any"
            }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestData)], {
          type: "application/json"
        });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const manifestLink = document.createElement("link");
        manifestLink.rel = "manifest";
        manifestLink.href = manifestUrl;
        document.head.appendChild(manifestLink);
      })();
    </script>

    <title>SkillSwap Campus</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
